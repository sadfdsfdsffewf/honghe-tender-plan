  const x=data[index]; if(!x) return;
  $('modalTitle').textContent=x.name||'项目详情';
  const items=[['项目行政主管地区',x.area],['入场登记部门',x.department],['招标人',x.tenderer],['预计招标公告发布时间',deadlineText(x)],['标段合同估算价（万元）',x.amount==null?'-':nf.format(amountValue(x))],['计划性质',x.nature],['发布时间',x.published],['交易平台',x.platform],['招标人联系人',x.contact],['联系电话',x.phone],['招标内容',x.content],['项目链接',x.remark]];
  $('modalBody').innerHTML=items.map(([k,v],i)=>{ const isLink=k==='项目链接'&&/^https?:\/\//.test(String(v||'')); const body=isLink?`<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`:esc(v||'-'); return `<div class="detail-item ${i>=10?'full':''}"><label>${esc(k)}</label><div class="${k==='联系电话'?'phone':''}">${body}</div></div>`; }).join('');
  $('modal').classList.add('open');
}
$('runAt').textContent=SUMMARY.run_at?SUMMARY.run_at.replace('T',' ').slice(0,16):'-';
$('activeCount').textContent=data.length;
$('knownCount').textContent=(SUMMARY.added_count||0)+(SUMMARY.updated_count||0);
$('soonCount').textContent=SUMMARY.soon_7d_count||0;
$('totalAmount').textContent=nf.format(SUMMARY.active_total_amount_wan||0);
fillRegions();
['search','region','window','amount','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
$('rows').addEventListener('click',e=>{const tr=e.target.closest('tr[data-i]'); if(tr) showDetail(Number(tr.dataset.i));});
$('cards').addEventListener('click',e=>{if(e.target.closest('a')) return; const card=e.target.closest('article[data-i]'); if(card) showDetail(Number(card.dataset.i));});
$('closeModal').onclick=()=>$('modal').classList.remove('open');
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('open')});
render();
</script>
</body>
</html>
